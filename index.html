<!DOCTYPE html>
<html>
<head>

    <title>项目状态通知</title>
    <style>

            background: #1a1a1a;

            font-size: 22px;
            margin-top: 0;
            letter-spacing: 1px;
        }
        p {
            line-height: 1.7;
            font-size: 15px;
            color: #aaa;
            margin: 16px 0;
        }
        .small {
            font-size: 13px;
            color: #777;
            border-top: 1px solid #444;
            padding-top: 20px;
            margin-top: 25px;
        }
        .status-badge {
            display: inline-block;
            background: #d32f2f;
            color: #fff;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
